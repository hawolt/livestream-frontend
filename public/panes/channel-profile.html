<div id="pane-channel-profile" class="tab-pane">
    <div class="card settings-card">
        <div class="section-title">Bio</div>
        <div class="form-grid">
            <label class="span2">
                <span>Bio</span>
                <textarea id="pf-bio" maxlength="500" rows="4"></textarea>
            </label>
        </div>
        <div id="pf-bio-count" style="color:var(--muted);font-size:12px;margin-top:4px">0 / 500</div>

        <div class="section-title" style="margin-top:28px">Links</div>
        <p style="color:var(--muted);font-size:13px;margin:0 0 12px">Up to 5 links, each with a label and an https url.</p>
        <div id="pf-links"></div>
        <button type="button" class="btn btn-sm" id="pf-link-add" style="margin-top:4px">Add link</button>

        <div style="margin-top:20px;display:flex;align-items:center;gap:12px">
            <button type="button" class="btn btn-primary" id="pf-save">Save</button>
            <span id="pf-saved" style="font-size:13px"></span>
        </div>

        <div class="section-title" style="margin-top:28px">Avatar</div>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
            <div id="pf-avatar-preview" style="width:80px;height:80px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0"></div>
            <div>
                <input type="file" id="pf-avatar-file" accept="image/png,image/jpeg,image/gif" hidden />
                <button type="button" class="btn btn-sm" id="pf-avatar-upload">Upload</button>
                <button type="button" class="btn btn-sm" id="pf-avatar-remove">Remove</button>
                <div id="pf-avatar-hint" style="font-size:12px;color:var(--muted);margin-top:6px"></div>
                <div id="pf-avatar-error" style="font-size:12px;color:var(--red);margin-top:6px"></div>
            </div>
        </div>

        <div class="section-title" style="margin-top:28px">Offline channel art</div>
        <p style="color:var(--muted);font-size:13px;margin:0 0 12px;max-width:520px">Shown on your channel page behind the Offline notice while you are not streaming. Use a 16:9 image, 1920x1080 works well.</p>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
            <div id="pf-banner-preview" style="width:240px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0"></div>
            <div>
                <input type="file" id="pf-banner-file" accept="image/png,image/jpeg,image/gif" hidden />
                <button type="button" class="btn btn-sm" id="pf-banner-upload">Upload</button>
                <button type="button" class="btn btn-sm" id="pf-banner-remove">Remove</button>
                <div id="pf-banner-hint" style="font-size:12px;color:var(--muted);margin-top:6px"></div>
                <div id="pf-banner-error" style="font-size:12px;color:var(--red);margin-top:6px"></div>
            </div>
        </div>
    </div>
</div>
