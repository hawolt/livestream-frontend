<div id="pane-activity" class="tab-pane">
    <div class="card-grid-2" style="margin-bottom:16px">
        <div class="card" id="act-viewer-chip" style="padding:24px;display:flex;align-items:center;gap:16px;cursor:pointer;user-select:none">
            <div>
                <div id="act-viewer-count" style="font-size:36px;font-weight:700;line-height:1">-</div>
                <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px">Viewers</div>
            </div>
            <div id="act-viewer-hint" style="font-size:11px;color:var(--dim);margin-left:auto">Click to hide</div>
        </div>
        <div class="card" style="padding:24px">
            <div id="act-follower-count" style="font-size:36px;font-weight:700;line-height:1">-</div>
            <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px">Followers</div>
        </div>
    </div>
    <div class="card" style="padding:24px;margin-bottom:16px">
        <div class="section-title">Stream info</div>
        <div id="live-info-body">Loading...</div>
    </div>
    <div class="card-grid-2">
        <div class="card" style="padding:0;overflow:hidden">
            <iframe id="act-chat-iframe" title="Chat" style="width:100%;height:600px;border:0;display:block"></iframe>
        </div>
        <div class="card" style="padding:24px">
            <div class="section-title">Recent activity</div>
            <div id="act-events-body" style="max-height:260px;overflow-y:auto;scrollbar-gutter:stable;padding-right:8px">Loading...</div>
        </div>
    </div>
</div>
