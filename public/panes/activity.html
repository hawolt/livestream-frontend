<div id="pane-activity" class="tab-pane">
    <style>
        #pane-activity .act-left-col,
        #pane-activity .act-left-col .card { min-height: 0 }
        #pane-activity .section-title { margin: 8px 0 10px }
        #pane-activity .form-grid { gap: 8px 16px }
        #pane-activity #live-info-error { margin-top: 4px !important }
        #pane-activity #live-info-body > div:nth-child(2) { margin-top: 4px !important }
        #pane-activity #live-info-body > div:nth-child(4) { margin-top: 8px !important }
        @media (min-width: 901px) {
            #pane-activity .act-main-row { height: min(560px, calc(100dvh - 220px)) }
        }
    </style>
    <div class="card-grid-2" style="margin-bottom:16px">
        <div class="card" id="act-viewer-chip" style="padding:24px;display:flex;align-items:center;gap:16px;cursor:pointer;user-select:none">
            <div>
                <div id="act-viewer-count" style="font-size:36px;font-weight:700;line-height:1">-</div>
                <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px">Viewers</div>
            </div>
            <div id="act-viewer-hint" style="font-size:11px;color:var(--dim);margin-left:auto">Click to hide</div>
        </div>
        <div class="card" style="padding:24px">
            <div id="act-follower-count" style="font-size:36px;font-weight:700;line-height:1">-</div>
            <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px">Followers</div>
        </div>
    </div>
    <div class="card-grid-2 act-main-row">
        <div class="act-left-col" style="display:flex;flex-direction:column;gap:16px">
            <div class="card" style="padding:24px;flex:1;display:flex;flex-direction:column">
                <div class="section-title">Stream info</div>
                <div id="live-info-body" style="flex:1;overflow-y:auto;min-height:0">Loading...</div>
            </div>
            <div class="card" style="padding:24px;flex:1;display:flex;flex-direction:column">
                <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
                    <span>Recent activity</span>
                    <span style="display:flex;align-items:center;gap:8px">
                        <input id="act-sound-volume" type="range" min="0" max="100" step="5" title="Alert sound volume" style="width:90px">
                        <button class="btn btn-sm" id="act-sound-toggle" type="button">Sound: on</button>
                    </span>
                </div>
                <div id="act-events-body" style="flex:1;overflow-y:auto;scrollbar-gutter:stable;padding-right:8px;min-height:0">Loading...</div>
            </div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
            <iframe id="act-chat-iframe" title="Chat" style="width:100%;height:100%;border:0;display:block"></iframe>
        </div>
    </div>
</div>
