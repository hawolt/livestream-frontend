<div id="pane-activity" class="tab-pane">
    <style>
        #pane-activity .act-left-col,
        #pane-activity .act-left-col .card { min-height: 0 }
        #pane-activity .section-title { margin: 8px 0 10px }
        #pane-activity .card > .section-title:first-child { margin-top: 0 }
        #pane-activity .form-grid { gap: 8px 16px }
        #pane-activity .act-ev { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(46, 46, 46, .5); font-size: 12.5px }
        #pane-activity .act-ev:last-child { border-bottom: 0 }
        #pane-activity .act-ev-type { justify-self: start; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; color: var(--dim); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; max-width: 84px; overflow: hidden; text-overflow: ellipsis }
        #pane-activity .act-ev-type-follow { color: var(--accent); border-color: rgba(74, 222, 128, .35) }
        #pane-activity .act-ev-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600 }
        #pane-activity .act-ev-time { white-space: nowrap; text-align: right; color: var(--text); font-variant-numeric: tabular-nums }
        #pane-activity .act-ev-empty { color: var(--muted); padding: 10px 0 }
        #pane-activity #live-info-error { margin-top: 4px !important }
        #pane-activity #live-info-body > div:nth-child(2) { margin-top: 4px !important }
        #pane-activity .act-main-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px); gap: 10px; align-items: stretch }
        #pane-activity .act-right-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0 }
        #pane-activity .act-right-col .dash-strip { margin: 0; flex-shrink: 0 }
        #pane-activity .act-right-col .dash-stat { flex: 1 1 0 }
        #pane-activity #act-viewer-count { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
        #pane-activity .act-chat-card { flex: 1; min-height: 0; padding: 0; overflow: hidden }
        @media (min-width: 901px) {
            #pane-activity .act-main-row { height: calc(100dvh - 92px); min-height: 420px }
        }
        @media (max-width: 900px) {
            #pane-activity .act-main-row { grid-template-columns: minmax(0, 1fr) }
            #pane-activity .act-right-col { order: -1 }
            #pane-activity .act-chat-card { height: min(560px, 70dvh) }
        }
    </style>
    <div class="act-main-row">
        <div class="act-left-col" style="display:flex;flex-direction:column;gap:10px">
            <div class="card" style="flex:4">
                <div class="section-title">Stream info</div>
                <div id="live-info-body" style="flex:1;overflow-y:auto;min-height:0">Loading...</div>
            </div>
            <div class="card" style="flex:6">
                <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
                    <span>Recent activity</span>
                    <span class="sound-pop-wrap">
                        <button class="btn btn-sm" id="act-sound-settings" type="button" title="Alert sound settings" aria-haspopup="true">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                        <div class="sound-pop" id="act-sound-pop">
                            <div class="sound-pop-row">
                                <span>Alert sound</span>
                                <input type="checkbox" id="act-sound-on">
                            </div>
                            <div class="sound-pop-row">
                                <span>Volume</span>
                                <input type="range" class="ov-range" id="act-sound-volume" min="0" max="100" step="5" style="width:110px">
                            </div>
                        </div>
                    </span>
                </div>
                <div id="act-events-body" style="flex:1;overflow-y:auto;scrollbar-gutter:stable;padding-right:8px;min-height:0">Loading...</div>
            </div>
        </div>
        <div class="act-right-col">
            <div class="dash-strip">
                <div class="dash-stat" id="act-viewer-chip" style="cursor:pointer;user-select:none">
                    <div class="dash-stat-label">Viewers · <span id="act-viewer-hint">Click to hide</span></div>
                    <div class="dash-stat-value" id="act-viewer-count">-</div>
                </div>
                <div class="dash-stat">
                    <div class="dash-stat-label">Followers</div>
                    <div class="dash-stat-value" id="act-follower-count">-</div>
                </div>
            </div>
            <div class="card act-chat-card">
                <iframe id="act-chat-iframe" title="Chat" style="width:100%;height:100%;border:0;display:block"></iframe>
            </div>
        </div>
    </div>
</div>
