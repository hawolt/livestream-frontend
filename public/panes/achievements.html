<div id="pane-achievements" class="tab-pane">
    <style>
        #pane-achievements .ach-summary { color: var(--dim); font-size: 12.5px; margin-bottom: 10px; }
        #pane-achievements .ach-medal {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            margin-bottom: 16px;
            color: var(--dim);
            font-size: 12.5px;
        }
        #pane-achievements .ach-medal[hidden] { display: none; }
        #pane-achievements .ach-medal img { display: block; width: 32px; height: 32px; flex: none; }
        #pane-achievements .ach-empty { color: var(--dim); padding: 40px 0; text-align: center; }
        #pane-achievements .ach-empty[hidden] { display: none; }
        #pane-achievements .ach-section + .ach-section { margin-top: 24px; }
        #pane-achievements .ach-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #pane-achievements .ach-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        #pane-achievements .ach-row.locked { opacity: .8; }
        #pane-achievements .ach-row-medallion { flex: none; }
        #pane-achievements .ach-row-medallion svg { display: block; width: 48px; height: 48px; }
        #pane-achievements .ach-row-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }
        #pane-achievements .ach-row-heading {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        #pane-achievements .ach-row-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
        }
        #pane-achievements .ach-row-tier {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .04em;
            color: var(--dim);
        }
        #pane-achievements .ach-row-description {
            font-size: 12px;
            color: var(--dim);
            line-height: 1.4;
        }
        #pane-achievements .ach-bar {
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            overflow: hidden;
            margin-top: 4px;
        }
        #pane-achievements .ach-bar-fill { height: 100%; background: var(--amber); border-radius: 999px; }
        #pane-achievements .ach-bar-label {
            font-size: 10.5px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }
        #pane-achievements .ach-state { font-size: 10.5px; font-weight: 600; margin-top: 4px; }
        #pane-achievements .ach-state-done { color: var(--accent); }
        #pane-achievements .ach-state-max { color: var(--amber); }
        #pane-achievements .ach-state-pending { color: var(--dim); font-weight: 400; }
        @media (max-width: 640px) {
            #pane-achievements .ach-row { padding: 12px; gap: 10px; }
            #pane-achievements .ach-row-medallion svg { width: 40px; height: 40px; }
        }
    </style>
    <div class="ach-summary" id="ach-summary"></div>
    <div class="ach-medal" id="ach-medal" hidden>
        <img src="/static/img/badge-medal.svg" width="32" height="32" alt="Medal badge" />
        <span id="ach-medal-text"></span>
    </div>
    <div class="ach-empty" id="ach-empty" hidden></div>
    <div id="ach-sections"></div>
</div>
