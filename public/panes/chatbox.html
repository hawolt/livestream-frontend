<div id="pane-chatbox" class="tab-pane">
    <div class="ov-layout">
        <div class="card">
            <div class="section-title">Chat overlay builder</div>
            <p style="font-size:13px;color:var(--muted);margin:0 0 16px">
                Customize how your chat looks as an OBS Browser Source, with a live preview on the right.
            </p>

            <div class="ov-section">Appearance</div>
            <div class="ov-grid">
                <label>
                    <span>Size</span>
                    <select id="ov-size">
                        <option value="s">Small</option>
                        <option value="m" selected>Medium</option>
                        <option value="l">Large</option>
                        <option value="xl">Extra large</option>
                        <option value="custom">Custom</option>
                    </select>
                </label>
                <label>
                    <span>Align</span>
                    <select id="ov-align">
                        <option value="left" selected>Left</option>
                        <option value="right">Right</option>
                    </select>
                </label>
                <label class="ov-span-2" id="ov-size-px-wrap" hidden>
                    <span>Custom size (px)</span>
                    <div class="stepper">
                        <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                        <input id="ov-size-px" type="number" min="10" max="120" value="48">
                        <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">+</button>
                    </div>
                    <div class="hint">Exact text size in pixels, 10 to 120.</div>
                </label>
                <label>
                    <span>Font</span>
                    <select id="ov-font">
                        <option value="system" selected>System default</option>
                        <option value="roboto">Roboto</option>
                        <option value="sans">Sans-serif</option>
                        <option value="serif">Serif</option>
                        <option value="mono">Monospace</option>
                        <option value="condensed">Condensed</option>
                        <option value="handwriting">Handwriting</option>
                    </select>
                </label>
                <label>
                    <span>Weight</span>
                    <select id="ov-weight">
                        <option value="default" selected>Default</option>
                        <option value="normal">Normal</option>
                        <option value="bold">Bold</option>
                        <option value="extrabold">Extra bold</option>
                    </select>
                    <div class="hint">Applies to the whole line, name and text together.</div>
                </label>
                <label class="ov-span-2">
                    <span>Fade</span>
                    <div class="stepper">
                        <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                        <input id="ov-fade" type="number" min="0" max="600" value="0">
                        <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">+</button>
                    </div>
                    <div class="hint">Seconds before a message disappears. 0 = messages never disappear.</div>
                </label>
                <label class="ov-toggle">
                    <input type="checkbox" id="ov-badges" checked>
                    <span>
                        <span class="ov-toggle-name">Badges</span>
                        <div class="hint">Role badges before names.</div>
                    </span>
                </label>
                <label class="ov-toggle">
                    <input type="checkbox" id="ov-emotes" checked>
                    <span>
                        <span class="ov-toggle-name">Emotes</span>
                        <div class="hint">Render 7TV emotes as images.</div>
                    </span>
                </label>
                <label class="ov-toggle">
                    <input type="checkbox" id="ov-bg">
                    <span>
                        <span class="ov-toggle-name">Background</span>
                        <div class="hint">Dark pill behind each line.</div>
                    </span>
                </label>
                <label>
                    <span>Shadow</span>
                    <select id="ov-shadow">
                        <option value="default" selected>Default</option>
                        <option value="0">None</option>
                        <option value="dropsm">Drop small</option>
                        <option value="dropmd">Drop medium</option>
                        <option value="droplg">Drop large</option>
                    </select>
                    <div class="hint">Default is a text shadow. Drop tiers halo badges and emotes too.</div>
                </label>
                <label class="ov-toggle">
                    <input type="checkbox" id="ov-system">
                    <span>
                        <span class="ov-toggle-name">System messages</span>
                        <div class="hint">Raids and channel point redemptions.</div>
                    </span>
                </label>
            </div>

            <div class="ov-section">Use it</div>
            <div class="ov-url-row">
                <code id="ov-url"></code>
                <button class="btn btn-sm" id="ov-url-copy" type="button">Copy</button>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Preview</div>
            <div class="ov-preview-toolbar">
                <button class="btn btn-sm btn-primary" id="ov-bg-checker" type="button">Checkerboard</button>
                <button class="btn btn-sm" id="ov-bg-dark" type="button">Dark</button>
            </div>
            <div class="ov-preview-frame bg-checker" id="ov-preview-frame">
                <iframe id="ov-preview-iframe" title="Overlay preview"></iframe>
            </div>
        </div>
    </div>
</div>
