<!DOCTYPE html>
<html lang="en" class="live-host">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/shared.css" />
    <link rel="stylesheet" href="/static/css/site.css" />
    <style>
        .auth-page { min-height: calc(100dvh - 52px); }
    </style>
</head>
<body>
<header class="site-nav">
    <a class="site-brand" href="/">itzon</a>
    <nav class="site-links">
        <a class="site-link" href="/" data-nav="browse">Browse</a>
    </nav>
    <div class="site-nav-right" id="site-nav-right"></div>
</header>
<div class="auth-page" id="login-page" hidden>
    <div class="login-wrap">
        <div class="login-eyebrow">Streaming Solutions</div>
        <h1 class="login-heading">itzon</h1>
        <div id="section-login">
            <form id="login-form">
                <div class="login-fields">
                    <input id="username" type="text" autocomplete="username" placeholder="Username" aria-label="Username" required />
                    <input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required />
                </div>
                <button type="submit" id="btn-login" class="login-btn">Sign In</button>
                <div id="error" role="alert"></div>
                <div id="lockout"></div>
            </form>
            <div class="login-footer">No account yet? <a href="/register">Create one</a></div>
            <div style="text-align:center;margin-top:14px">
                <a href="#" id="btn-show-forgot" style="font-size:12.5px;color:var(--muted)">Forgot password?</a>
            </div>
        </div>

        <div id="section-forgot" style="display:none">
            <form id="forgot-form">
                <div class="login-fields">
                    <input id="forgot-email" type="email" autocomplete="email" placeholder="Your account email" aria-label="Your account email" required />
                </div>
                <button type="submit" id="btn-forgot" class="login-btn">Send reset link</button>
                <div id="forgot-msg" role="status"></div>
            </form>
            <div class="login-footer"><a href="#" id="btn-back-login">&#8592; Back to sign in</a></div>
        </div>
    </div>
</div>
<script src="/user-login.js" type="module"></script>
</body>
</html>
