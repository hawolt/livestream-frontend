<!DOCTYPE html>
<html lang="en" class="live-host">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/img/favicon.png" />
    <link rel="apple-touch-icon" href="/static/img/icon.png" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>Log in | ITZON</title>
    <link rel="canonical" href="https://itzon.tv/login" />
    <meta name="description" content="Log in to your ITZON account." />
    <link rel="stylesheet" href="/static/css/shared.css" />
    <script>try{var c=document.cookie.match(/(?:^|; )site_accent=([^;]*)/);var a=c?decodeURIComponent(c[1]):localStorage.getItem("site_accent");if(a&&a!=="malachite"){document.documentElement.setAttribute("data-accent",a);var m={"beacon":["/static/img/favicon-beacon.png","/static/img/icon-beacon.png"]}[a];if(m){var i=document.querySelector('link[rel="icon"]');if(i)i.href=m[0];var t=document.querySelector('link[rel="apple-touch-icon"]');if(t)t.href=m[1]}}}catch(e){}</script>
    <link rel="stylesheet" href="/static/css/site.css" />
    <style>
        .auth-page { min-height: calc(100dvh - 52px); }
    </style>
</head>
<body>
<header class="site-nav">
    <a class="site-brand" href="/" aria-label="ITZON"><svg class="brand-o" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="currentColor"/><path d="M24 18 L44 32 L24 46 Z" fill="var(--bg)"/></svg><span class="brand-wm">ITZON</span></a>
    <nav class="site-links">
        <a class="site-link" href="/" data-nav="browse">Browse</a>
    </nav>
    <div class="site-nav-right" id="site-nav-right"></div>
</header>
<div class="auth-page" id="login-page" hidden>
    <div class="login-wrap">
        <div class="login-eyebrow">Streaming Solutions</div>
        <h1 class="login-heading">ITZON</h1>
        <div id="section-login">
            <form id="login-form">
                <div class="login-fields">
                    <input id="username" type="text" autocomplete="username" placeholder="Username" aria-label="Username" required />
                    <input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required />
                </div>
                <button type="submit" id="btn-login" class="login-btn">Sign In</button>
                <div id="error" role="alert"></div>
                <div id="lockout"></div>
            </form>
            <div class="login-footer">No account yet? <a id="register-link" href="/register">Create one</a></div>
            <div style="text-align:center;margin-top:14px">
                <a href="#" id="btn-show-forgot" style="font-size:12.5px;color:var(--muted)">Forgot password?</a>
            </div>
        </div>

        <div id="section-forgot" style="display:none">
            <form id="forgot-form">
                <div class="login-fields">
                    <input id="forgot-email" type="email" autocomplete="email" placeholder="Your account email" aria-label="Your account email" required />
                </div>
                <button type="submit" id="btn-forgot" class="login-btn">Send reset link</button>
                <div id="forgot-msg" role="status"></div>
            </form>
            <div class="login-footer"><a href="#" id="btn-back-login">&#8592; Back to sign in</a></div>
        </div>
    </div>
</div>
<script src="/user-login-e6c4v1rf.js" type="module"></script>
</body>
</html>
