<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Chat overlay</title>
    <style>
        @font-face {
            font-family: "Roboto";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("/static/fonts/roboto-variable-latin-ext.woff2") format("woff2");
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: "Roboto";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("/static/fonts/roboto-variable-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        * { scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 18px;
        }
        body[data-size="s"] { font-size: 14px; }
        body[data-size="l"] { font-size: 24px; }
        body[data-size="xl"] { font-size: 48px; }

        #chat-messages {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            gap: 2px;
            padding: 8px;
            overflow: hidden;
        }
        body[data-align="right"] #chat-messages { align-items: flex-end; }

        .msg {
            max-width: 100%;
            line-height: 1.35;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,.9);
            word-break: break-word;
            transition: opacity .4s ease;
        }
        @media (prefers-reduced-motion: reduce) {
            .msg { transition-duration: .01ms; }
        }
        body[data-shadow="0"] .msg { text-shadow: none; }
        body[data-shadow="dropsm"] .msg { text-shadow: none; filter: drop-shadow(2px 2px 0.2rem black); }
        body[data-shadow="dropmd"] .msg { text-shadow: none; filter: drop-shadow(2px 2px 0.35rem black); }
        body[data-shadow="droplg"] .msg { text-shadow: none; filter: drop-shadow(2px 2px 0.5rem black); }
        body[data-bg="1"][data-shadow="dropsm"] .msg,
        body[data-bg="1"][data-shadow="dropmd"] .msg,
        body[data-bg="1"][data-shadow="droplg"] .msg { filter: none; }
        body[data-align="right"] .msg { text-align: right; }
        body[data-bg="1"] .msg {
            background: rgba(0,0,0,.55);
            border-radius: 6px;
            padding: 3px 8px;
        }
        .msg.fade-out { opacity: 0; }

        .msg.sys {
            font-style: italic;
            color: #ffd479;
        }
        body[data-bg="1"] .msg.sys { background: rgba(80,60,0,.55); }

        .nick { font-weight: 700; }
        body[data-weight="normal"] .msg, body[data-weight="normal"] .nick { font-weight: 400; }
        body[data-weight="bold"] .msg, body[data-weight="bold"] .nick { font-weight: 700; }
        body[data-weight="extrabold"] .msg, body[data-weight="extrabold"] .nick { font-weight: 800; }

        .badge {
            display: inline-block;
            height: 1.1em;
            vertical-align: -0.21em;
            margin-right: 2px;
        }
        .emote {
            display: inline-block;
            height: 1.6em;
            vertical-align: -0.46em;
            margin: 0 1px;
        }
        .emote-stack {
            position: relative;
            display: inline-block;
        }
        .emote-zw {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }
    </style>
</head>
<body>
<div id="chat-messages"></div>
<script src="/chat-overlay-c3pb0zhr.js" type="module"></script>
</body>
</html>
