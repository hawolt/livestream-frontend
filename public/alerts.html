<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Follow alerts overlay</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 22px;
        }

        #alert-stage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            --alert-accent: #ffd76a;
            --alert-bg-rgb: 20, 18, 30;
            --alert-bg-opacity: .85;
            --alert-text: #fff;
            --alert-font-size: 22px;
            --alert-fade-in: .5s;
            --alert-fade-out: .35s;
        }

        .alert-card {
            background: rgba(var(--alert-bg-rgb), var(--alert-bg-opacity));
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: .73em;
            padding: .82em 1.45em;
            color: var(--alert-text);
            text-align: center;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
            font-size: var(--alert-font-size);
        }

        .alert-card-raid {
            border-color: var(--alert-accent);
            box-shadow: 0 10px 28px rgba(0, 0, 0, .5), 0 0 14px rgba(255, 255, 255, .12);
        }

        .alert-name {
            font-size: 1.6em;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
        }

        .alert-caption {
            margin-top: 4px;
            font-size: .8em;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--alert-accent);
        }

        #alert-stage[data-preset="minimal"] .alert-card {
            background: transparent;
            border: none;
            box-shadow: none;
        }
        #alert-stage[data-preset="minimal"] .alert-name,
        #alert-stage[data-preset="minimal"] .alert-caption {
            text-shadow: 0 1px 4px rgba(0, 0, 0, .95);
        }

        #alert-stage[data-preset="banner"] {
            align-items: flex-start;
        }
        #alert-stage[data-preset="banner"] .alert-card {
            width: 100%;
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-top: none;
        }

        @keyframes alert-in {
            0% { opacity: 0; transform: translateY(28px) scale(.85); }
            60% { opacity: 1; transform: translateY(-6px) scale(1.04); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes alert-out {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-28px) scale(.85); }
        }
        .alert-card.enter { animation: alert-in var(--alert-fade-in) cubic-bezier(.34, 1.56, .64, 1) forwards; }
        .alert-card.exit { animation: alert-out var(--alert-fade-out) ease-in forwards; }
        @media (prefers-reduced-motion: reduce) {
            .alert-card.enter,
            .alert-card.exit { animation-duration: .01ms; animation-timing-function: linear; }
        }
        #sound-unlock {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            background: rgba(20, 20, 24, 0.92);
            color: #efeff1;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
<div id="alert-stage"></div>
<script src="/follow-alerts.js" type="module"></script>
</body>
</html>
