<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Multichat</title>
    <link rel="icon" href="/static/img/favicon.png" />
    <style>
        @font-face {
            font-family: "Roboto";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("/static/fonts/roboto-variable-latin-ext.woff2") format("woff2");
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: "Roboto";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("/static/fonts/roboto-variable-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        * { scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body {
            background: #0f0f12;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #efeff1;
        }
        body[data-size="s"] { font-size: 12px; }
        body[data-size="l"] { font-size: 18px; }
        body[data-size="xl"] { font-size: 48px; }

        #chat-scroll {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            scrollbar-width: none;
        }
        #chat-scroll::-webkit-scrollbar { display: none; }
        #chat-messages {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 3px;
            min-height: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        .msg {
            line-height: 1.4;
            word-break: break-word;
            transition: opacity .4s ease;
        }
        .msg.fade-out { opacity: 0; }
        body[data-linebg="1"] .msg {
            background: rgba(0, 0, 0, .55);
            border-radius: 6px;
            padding: 3px 8px;
            align-self: flex-start;
        }
        body[data-overlay="1"] {
            background: transparent;
        }
        body[data-overlay="1"] #chat-scroll {
            overflow: hidden;
        }
        body[data-overlay="1"] #resume { display: none !important; }
        body[data-overlay="1"] .msg {
            text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
        }
        body[data-shadow="0"] .msg { text-shadow: none; }
        body[data-overlay="1"][data-shadow="dropsm"] .msg { text-shadow: none; filter: drop-shadow(2px 2px 0.2rem black); }
        body[data-overlay="1"][data-shadow="dropmd"] .msg { text-shadow: none; filter: drop-shadow(2px 2px 0.35rem black); }
        body[data-overlay="1"][data-shadow="droplg"] .msg { text-shadow: none; filter: drop-shadow(2px 2px 0.5rem black); }
        body[data-linebg="1"][data-shadow="dropsm"] .msg,
        body[data-linebg="1"][data-shadow="dropmd"] .msg,
        body[data-linebg="1"][data-shadow="droplg"] .msg { filter: none; }
        .badge {
            display: inline-block;
            height: 1.1em;
            vertical-align: -0.21em;
            margin-right: 3px;
        }
        .badge-svg {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            margin-right: 3px;
        }
        .badge-svg svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .chip {
            display: inline-block;
            font-size: 0.62em;
            font-weight: 700;
            letter-spacing: 0.4px;
            border: 1px solid;
            border-radius: 3px;
            padding: 0 3px;
            margin-right: 3px;
            vertical-align: 0.14em;
        }
        .nick-yt-owner {
            background: #ffd600;
            color: #0f0f12 !important;
            border-radius: 3px;
            padding: 0 4px;
        }
        .msg .picon {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            margin-right: 5px;
        }
        .msg .picon img, .msg .picon svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .nick { font-weight: 700; }
        body[data-weight="normal"] .msg, body[data-weight="normal"] .nick { font-weight: 400; }
        body[data-weight="bold"] .msg, body[data-weight="bold"] .nick { font-weight: 700; }
        body[data-weight="extrabold"] .msg, body[data-weight="extrabold"] .nick { font-weight: 800; }
        .amount {
            font-weight: 700;
            color: #2ecc71;
            margin-right: 4px;
        }
        .emote {
            display: inline-block;
            height: 1.6em;
            vertical-align: -0.46em;
            margin: 0 1px;
        }
        .emote-stack { position: relative; display: inline-block; }
        .emote-zw {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }

        .sys {
            color: #7d7d85;
            font-style: italic;
            font-size: 0.92em;
        }
        .sys .picon { opacity: 0.6; }

        #resume {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            background: rgba(30, 30, 36, 0.95);
            color: #efeff1;
            border: 1px solid #3a3a40;
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
            display: none;
        }
        #resume.show { display: block; }

        #hint {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: #9a9aa3;
            line-height: 1.8;
        }
        #hint.show { display: flex; }
        #hint code {
            background: #1c1c22;
            border-radius: 4px;
            padding: 1px 6px;
        }
    </style>
</head>
<body>
<div id="chat-scroll"><div id="chat-messages"></div></div>
<button id="resume" type="button">Resume scrolling</button>
<div id="hint"></div>
<script src="/multichat-m108nz88.js" type="module"></script>
</body>
</html>
