<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multichat</title>
    <link rel="icon" href="/static/img/favicon.png" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0f0f12;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #efeff1;
        }
        body[data-size="s"] { font-size: 12px; }
        body[data-size="l"] { font-size: 18px; }

        #chat-scroll {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #3a3a40 transparent;
        }
        #chat-messages {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 3px;
            min-height: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        .msg {
            line-height: 1.4;
            word-break: break-word;
            transition: opacity .4s ease;
        }
        .msg.fade-out { opacity: 0; }
        body[data-linebg="1"] .msg {
            background: rgba(0, 0, 0, .55);
            border-radius: 6px;
            padding: 3px 8px;
            align-self: flex-start;
        }
        body[data-overlay="1"] {
            background: transparent;
        }
        body[data-overlay="1"] #chat-scroll {
            overflow: hidden;
        }
        body[data-overlay="1"] #resume { display: none !important; }
        body[data-overlay="1"] .msg {
            text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
        }
        body[data-shadow="0"] .msg { text-shadow: none; }
        .badge {
            display: inline-block;
            height: 1.1em;
            vertical-align: -0.21em;
            margin-right: 3px;
        }
        .msg .picon {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            margin-right: 5px;
        }
        .msg .picon img, .msg .picon svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .nick { font-weight: 700; }
        .amount {
            font-weight: 700;
            color: #2ecc71;
            margin-right: 4px;
        }
        .emote {
            display: inline-block;
            height: 1.6em;
            vertical-align: -0.46em;
            margin: 0 1px;
        }
        .emote-stack { position: relative; display: inline-block; }
        .emote-zw {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }

        .sys {
            color: #7d7d85;
            font-style: italic;
            font-size: 0.92em;
        }
        .sys .picon { opacity: 0.6; }

        #resume {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            background: rgba(30, 30, 36, 0.95);
            color: #efeff1;
            border: 1px solid #3a3a40;
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
            display: none;
        }
        #resume.show { display: block; }

        #hint {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: #9a9aa3;
            line-height: 1.8;
        }
        #hint.show { display: flex; }
        #hint code {
            background: #1c1c22;
            border-radius: 4px;
            padding: 1px 6px;
        }
    </style>
</head>
<body>
<div id="chat-scroll"><div id="chat-messages"></div></div>
<button id="resume" type="button">Resume scrolling</button>
<div id="hint"></div>
<script src="/multichat.js" type="module"></script>
</body>
</html>
