<!DOCTYPE html>
<html lang="en" class="live-host">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore</title>
    <link rel="canonical" href="https://itzon.tv/" />
    <meta name="description" content="Watch live streams, no login required." />
    <meta property="og:site_name" content="ITZON" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ITZON" />
    <meta property="og:description" content="Watch live streams, no login required." />
    <meta property="og:url" content="https://itzon.tv/" />
    <meta property="og:image" content="https://itzon.tv/api/live/site-preview.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ITZON" />
    <meta name="twitter:description" content="Watch live streams, no login required." />
    <meta name="twitter:image" content="https://itzon.tv/api/live/site-preview.jpg?v=2" />
    <link rel="stylesheet" href="/static/css/shared.css" />
    <link rel="stylesheet" href="/static/css/site.css" />
    <link rel="stylesheet" href="/static/css/explore.css" />
</head>
<body>
<header class="site-nav">
    <a class="site-brand" href="/" aria-label="ITZON"><img class="brand-o" src="/static/img/brand-o.png" alt=""><span class="brand-wm">ITZON</span></a>
    <nav class="site-links">
        <a class="site-link" href="/" data-nav="browse">Browse</a>
    </nav>
    <div class="site-nav-right" id="site-nav-right"></div>
</header>
<div class="explore-shell">
    <aside class="live-channel-rail" id="live-channel-rail" aria-label="Live channels">
        <div class="live-channel-rail-head">
            <span class="live-channel-rail-title">Live channels</span>
            <span class="live-channel-count" id="live-channel-count" aria-live="polite">0</span>
            <button class="live-channel-rail-toggle" id="live-channel-rail-toggle" type="button" title="Collapse live channels" aria-label="Collapse live channels" aria-expanded="true"><span id="live-channel-rail-toggle-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span></button>
        </div>
        <div class="live-channel-rail-body">
            <div class="live-channel-list" id="live-channel-list" role="navigation" aria-label="Streaming now"></div>
            <div class="live-channel-status" id="live-channel-status" role="status" aria-live="polite">Loading live channels...</div>
        </div>
    </aside>
    <div class="explore-content">
        <div class="explore-modes">
            <button class="explore-mode-btn active" id="mode-streams" type="button">Streams</button>
            <button class="explore-mode-btn" id="mode-categories" type="button">Categories</button>
            <div class="explore-lang"><input id="explore-language" type="text" placeholder="Any language" aria-label="Filter streams by language"></div>
        </div>
        <main class="explore-main" id="explore-page" hidden>
            <div class="explore-drill hidden" id="explore-drill">
                <button class="explore-back" id="explore-back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Back to categories</span></button>
                <div class="explore-drill-title" id="explore-drill-title"></div>
            </div>
            <div class="explore-empty hidden" id="explore-empty">No one is live right now</div>
            <div class="explore-grid" id="explore-grid"></div>
        </main>
    </div>
</div>
<script src="/explore-b0amy5ky.js" type="module"></script>
</body>
</html>
