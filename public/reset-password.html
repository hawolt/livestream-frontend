<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/static/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="/static/css/shared.css" />
    <link rel="stylesheet" href="/static/css/site.css" />
    <style>
        .auth-page { min-height: calc(100dvh - 52px); }
    </style>
</head>
<body>
<header class="site-nav">
    <a class="site-brand" href="/">ITZon</a>
    <nav class="site-links">
        <a class="site-link" href="/" data-nav="browse">Browse</a>
    </nav>
    <div class="site-nav-right" id="site-nav-right"></div>
</header>
<div class="auth-page">
    <div class="login-wrap">
        <div class="login-eyebrow">Admin Dashboard</div>
        <h1 class="login-heading">Reset Password</h1>
        <div id="section-form">
            <form id="reset-form">
                <div class="login-fields">
                    <input id="new-password" type="password" autocomplete="new-password" placeholder="New password" aria-label="New password" aria-describedby="reset-password-hint" required minlength="8" />
                    <div>
                        <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Confirm new password" aria-label="Confirm new password" aria-describedby="reset-password-hint" required minlength="8" />
                        <div class="login-hint" id="reset-password-hint">At least 8 characters.</div>
                    </div>
                </div>
                <button type="submit" id="btn-reset" class="login-btn">Set New Password</button>
                <div id="error" role="alert"></div>
            </form>
        </div>
        <div id="section-done" role="status" style="display:none;text-align:center">
            <p style="color:var(--green);margin-bottom:20px">Password reset successfully.</p>
            <a href="/login" class="btn-go-login">Sign In</a>
        </div>
    </div>
</div>
<script src="/reset-password.js" type="module"></script>
</body>
</html>
