<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ITZon embed</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #embed-stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #embed-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        body.embed-preview #embed-video { object-fit: cover; }
        #embed-poster {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a8a8a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            letter-spacing: .02em;
            background: #000;
            pointer-events: none;
        }
        #embed-poster.hidden { display: none; }
        #embed-unmute {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 6px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            cursor: pointer;
        }
        #embed-unmute:hover { background: rgba(0, 0, 0, .9); }
        #embed-unmute.hidden { display: none; }
        body.embed-preview #embed-unmute { display: none; }
        body.embed-cleanfeed #embed-unmute { display: none; }
        body.embed-controls #embed-unmute { display: none; }
        #embed-unmute svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>
<div id="embed-stage">
    <video id="embed-video" muted autoplay playsinline></video>
    <div id="embed-poster" class="hidden"></div>
    <button id="embed-unmute" type="button" class="hidden">
        <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8 8 0 010 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <span>Unmute</span>
    </button>
</div>
<script src="/embed.js" type="module"></script>
</body>
</html>
