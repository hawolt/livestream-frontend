<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ITZON embed</title>
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('/fonts/inter-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('/fonts/inter-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #embed-stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #embed-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        body.embed-preview #embed-video { object-fit: cover; }
        #embed-poster {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a8a8a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            letter-spacing: .02em;
            background: #000;
            pointer-events: none;
        }
        #embed-poster.hidden { display: none; }
        #embed-unmute {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 6px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            cursor: pointer;
        }
        #embed-unmute:hover { background: rgba(0, 0, 0, .9); }
        #embed-unmute.hidden { display: none; }
        body.embed-preview #embed-unmute { display: none; }
        body.embed-cleanfeed #embed-unmute { display: none; }
        body.embed-controls #embed-unmute { display: none; }
        #embed-unmute svg { width: 16px; height: 16px; fill: currentColor; }
        #embed-overlay {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .18s ease;
            pointer-events: none;
            background: linear-gradient(rgba(0, 0, 0, .55), transparent 26%, transparent 72%, rgba(0, 0, 0, .55));
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #embed-stage:hover #embed-overlay,
        #embed-overlay.embed-overlay-visible,
        body.embed-user-paused #embed-overlay { opacity: 1; }
        body.embed-preview #embed-overlay,
        body.embed-cleanfeed #embed-overlay,
        body.embed-controls #embed-overlay { display: none; }
        #embed-channel {
            position: absolute;
            top: 10px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: calc(100% - 140px);
            padding: 6px 10px;
            background: rgba(0, 0, 0, .6);
            border-radius: 6px;
            pointer-events: auto;
            color: #fff;
            text-decoration: none;
        }
        #embed-channel-name {
            font-size: 15px;
            font-weight: 700;
            text-decoration: underline;
        }
        #embed-channel-title {
            font-size: 12.5px;
            color: rgba(255, 255, 255, .85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #embed-channel-title[hidden] { display: none; }
        #embed-brand {
            position: absolute;
            top: 10px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, .6);
            border-radius: 6px;
            pointer-events: auto;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
        }
        #embed-brand img {
            display: block;
            width: 20px;
            height: 20px;
        }
        body.embed-preview #embed-brand,
        body.embed-cleanfeed #embed-brand,
        body.embed-controls #embed-brand { display: none; }
        #embed-controls-bar {
            position: absolute;
            left: 12px;
            bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }
        body.embed-offline #embed-controls-bar { display: none; }
        #embed-controls-bar button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .8));
        }
        #embed-controls-bar button:hover { color: rgba(255, 255, 255, .8); }
        #embed-controls-bar svg { width: 22px; height: 22px; fill: currentColor; }
        #embed-volume {
            width: 80px;
            accent-color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="embed-stage">
    <video id="embed-video" muted autoplay playsinline></video>
    <div id="embed-poster" class="hidden"></div>
    <button id="embed-unmute" type="button" class="hidden">
        <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8 8 0 010 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <span>Unmute</span>
    </button>
    <div id="embed-overlay">
        <a id="embed-channel" target="_blank" rel="noopener">
            <span id="embed-channel-name"></span>
            <span id="embed-channel-title" hidden></span>
        </a>
        <div id="embed-controls-bar">
            <button id="embed-play" type="button" aria-label="Pause"></button>
            <button id="embed-mute" type="button" aria-label="Mute"></button>
            <input id="embed-volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume" />
        </div>
    </div>
    <a id="embed-brand" href="/" target="_blank" rel="noopener" aria-label="ITZON">
        <img src="/static/img/brand-o.png" alt="" />
        <span>ITZON</span>
    </a>
</div>
<script src="/embed-1y1sgkrh.js" type="module"></script>
</body>
</html>
