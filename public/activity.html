<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Recent activity overlay</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        * { scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }
        #act-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
            box-sizing: border-box;
            overflow: hidden;
            background: rgba(12, 14, 20, 0.82);
            border-radius: 10px;
        }
        body[data-bg="0"] #act-stage { background: transparent; border-radius: 0; }
        .act-ev {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            line-height: 1.3;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        .act-ev-type {
            flex: 0 0 auto;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.04em;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }
        .act-ev-type-follow { background: #3b82f6; }
        .act-ev-type-subscription { background: #a855f7; }
        .act-ev-type-raid { background: #f59e0b; }
        .act-ev-type-pointsredeem { background: #10b981; }
        .act-ev-type-reject, .act-ev-type-warn { background: #ef4444; }
        .act-ev-text {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div id="act-stage"></div>
<script src="/activity-card-afetr1f7.js" type="module"></script>
</body>
</html>
