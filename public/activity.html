<!DOCTYPE html>
<html lang="en" class="live-host">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Recent activity</title>
    <link rel="stylesheet" href="/static/css/shared.css" />
    <script>try{var c=document.cookie.match(/(?:^|; )site_accent=([^;]*)/);var a=c?decodeURIComponent(c[1]):localStorage.getItem("site_accent");if(a&&a!=="malachite"){document.documentElement.setAttribute("data-accent",a);var m={"beacon":["/static/img/favicon-beacon.png","/static/img/icon-beacon.png"]}[a];if(m){var i=document.querySelector('link[rel="icon"]');if(i)i.href=m[0];var t=document.querySelector('link[rel="apple-touch-icon"]');if(t)t.href=m[1]}}}catch(e){}</script>
    <link rel="stylesheet" href="/static/css/site.css" />
    <style>
        body { margin: 0; padding: 12px; box-sizing: border-box; min-height: 100vh; background: var(--bg); }
        #act-dock { max-width: 640px; margin: 0 auto; }
        #act-dock .card { display: flex; flex-direction: column; min-height: 0 }
        #act-stage { margin-top: 10px; overflow-y: auto; scrollbar-gutter: stable }
        .act-ev { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(46, 46, 46, .5); font-size: 12.5px }
        .act-ev:last-child { border-bottom: 0 }
        .act-ev-type { justify-self: start; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; color: var(--dim); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; max-width: 84px; overflow: hidden; text-overflow: ellipsis }
        .act-ev-type-follow { color: var(--accent); border-color: rgba(var(--accent-rgb), .35) }
        .act-ev-type-raid { color: #c084fc; border-color: rgba(192, 132, 252, .40) }
        .act-ev-type-pointsredeem { color: #34d399; border-color: rgba(52, 211, 153, .40) }
        .act-ev-type-reject, .act-ev-type-warn { color: #f87171; border-color: rgba(var(--red-rgb), .40) }
        .act-ev-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600 }
        .act-ev-time { white-space: nowrap; text-align: right; color: var(--text); font-variant-numeric: tabular-nums }
        .act-ev-empty { color: var(--muted); padding: 10px 0 }
    </style>
</head>
<body>
<div id="act-dock">
    <div class="card">
        <div class="section-title">Recent activity</div>
        <div id="act-stage">Loading...</div>
    </div>
</div>
<script src="/activity-card-bxjg6rk0.js" type="module"></script>
</body>
</html>
