<!DOCTYPE html>
<html lang="en" class="live-host">
<head>
    <meta charset="UTF-8" />

    <meta name="robots" content="noindex,nofollow" />
    <title>Dashboard | ITZON</title>
    <link rel="stylesheet" href="/static/css/shared.css" />
    <script>try{var c=document.cookie.match(/(?:^|; )site_accent=([^;]*)/);var a=c?decodeURIComponent(c[1]):localStorage.getItem("site_accent");if(a&&a!=="malachite"){document.documentElement.setAttribute("data-accent",a);var m={"beacon":["/static/img/favicon-beacon.png","/static/img/icon-beacon.png"]}[a];if(m){var i=document.querySelector('link[rel="icon"]');if(i)i.href=m[0];var t=document.querySelector('link[rel="apple-touch-icon"]');if(t)t.href=m[1]}}}catch(e){}</script>
    <link rel="stylesheet" href="/static/css/site.css" />
</head>
<body>
<header class="site-nav">
    <a class="site-brand" href="/" aria-label="ITZON"><svg class="brand-o" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="currentColor"/><path d="M24 18 L44 32 L24 46 Z" fill="var(--bg)"/></svg><span class="brand-wm">ITZON</span></a>
    <nav class="site-links">
        <a class="site-link" href="/" data-nav="browse">Browse</a>
    </nav>
    <div class="site-nav-right" id="site-nav-right"></div>
</header>

<div class="dash-layout">
    <aside class="dash-side" id="dash-side" hidden></aside>
    <main id="panes"></main>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div id="modal-box" tabindex="-1">
        <div id="modal-head">
            <h3 id="modal-title"></h3>
            <button id="modal-close" type="button" aria-label="Close dialog">&#x2715;</button>
        </div>
        <div id="modal-body"></div>
        <div id="modal-foot"></div>
    </div>
</div>

<div id="terms-gate" role="dialog" aria-modal="true" aria-labelledby="terms-gate-title" aria-hidden="true" hidden>
    <div id="terms-gate-box" tabindex="-1">
        <h2 id="terms-gate-title">Before you continue</h2>
        <p id="terms-gate-intro"></p>
        <form id="terms-gate-form">
            <div id="terms-gate-birth-year" hidden>
                <label class="login-field-label" for="terms-gate-year">Year of birth</label>
                <select id="terms-gate-year" autocomplete="bday-year" required>
                    <option value="">Select year</option>
                </select>
                <div class="login-hint" id="terms-gate-year-hint"></div>
            </div>
            <div class="login-consent">
                <label class="login-consent-row">
                    <input id="terms-gate-accept" type="checkbox" required />
                    <span>I accept the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a> and the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span>
                </label>
                <label class="login-consent-row">
                    <input id="terms-gate-marketing" type="checkbox" />
                    <span>Email me product news and offers. Optional, and you can unsubscribe at any time.</span>
                </label>
            </div>
            <div id="terms-gate-error" role="alert" hidden></div>
            <div id="terms-gate-actions">
                <button type="button" id="terms-gate-signout" class="btn">Sign out</button>
                <button type="submit" id="terms-gate-submit" class="btn btn-primary">Accept and continue</button>
            </div>
        </form>
    </div>
</div>

<script src="/dash/dashboard-5y2agg4a.js" type="module"></script>
</body>
</html>
