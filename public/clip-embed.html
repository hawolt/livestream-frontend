<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ITZON clip</title>
    <style>
        :root {
            --accent-rgb: 74, 222, 128;
            --accent: rgb(var(--accent-rgb));
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #clip-embed-stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }
        #clip-embed-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #clip-embed-video.hidden { display: none; }
        #clip-embed-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            box-sizing: border-box;
            color: #8a8a8a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            letter-spacing: .02em;
            background: #000;
        }
        #clip-embed-state.hidden { display: none; }
        #clip-embed-open, #clip-embed-watch-live {
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s ease;
        }
        #clip-embed-stage.chrome-visible #clip-embed-open,
        #clip-embed-stage.chrome-visible #clip-embed-watch-live {
            opacity: 1;
            pointer-events: auto;
        }
        @media (prefers-reduced-motion: reduce) {
            #clip-embed-open, #clip-embed-watch-live { transition: none; }
        }
        #clip-embed-open {
            position: absolute;
            right: 8px;
            top: 8px;
            padding: 3px 8px;
            background: rgba(0, 0, 0, .55);
            border-radius: 6px;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: .02em;
            text-decoration: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
        }
        #clip-embed-open:hover { background: rgba(0, 0, 0, .75); }
        #clip-embed-open.hidden { display: none; }
        #clip-embed-watch-live {
            position: absolute;
            right: 16px;
            bottom: 68px;
            padding: 7px 14px;
            background: var(--accent);
            border-radius: 3px;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .02em;
            text-decoration: none;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
        }
        #clip-embed-watch-live:hover { filter: brightness(1.08); }
        #clip-embed-watch-live.hidden { display: none; }
    </style>
</head>
<body>
<div id="clip-embed-stage">
    <video id="clip-embed-video" class="hidden" muted autoplay playsinline controls></video>
    <div id="clip-embed-state"></div>
    <a id="clip-embed-open" class="hidden" href="#" target="_blank" rel="noopener">Open Clip</a>
    <a id="clip-embed-watch-live" class="hidden" href="#" target="_blank" rel="noopener">Watch live now</a>
</div>
<script src="/clip-embed-23q7xjve.js" type="module"></script>
</body>
</html>
