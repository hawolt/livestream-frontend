<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ITZon clip</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #clip-embed-stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }
        #clip-embed-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #clip-embed-video.hidden { display: none; }
        #clip-embed-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            box-sizing: border-box;
            color: #8a8a8a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            letter-spacing: .02em;
            background: #000;
        }
        #clip-embed-state.hidden { display: none; }
        #clip-embed-open {
            position: absolute;
            right: 10px;
            bottom: 10px;
            padding: 4px 9px;
            background: rgba(0, 0, 0, .65);
            border: 1px solid rgba(74, 222, 128, .45);
            border-radius: 5px;
            color: #4ade80;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .02em;
            text-decoration: none;
        }
        #clip-embed-open:hover { background: rgba(0, 0, 0, .85); }
        #clip-embed-open.hidden { display: none; }
    </style>
</head>
<body>
<div id="clip-embed-stage">
    <video id="clip-embed-video" class="hidden" muted autoplay playsinline controls></video>
    <div id="clip-embed-state"></div>
    <a id="clip-embed-open" class="hidden" href="#" target="_blank" rel="noopener">ITZon</a>
</div>
<script src="/clip-embed.js" type="module"></script>
</body>
</html>
